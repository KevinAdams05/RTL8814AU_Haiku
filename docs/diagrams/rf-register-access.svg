<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
  <style>
    .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
    .chip  { fill: #e7eef7; stroke: #2c5aa0; stroke-width: 1.4; }
    .write { fill: #e7f5ea; stroke: #2c8a4a; stroke-width: 1.4; }
    .read  { fill: #fffdf2; stroke: #b08020; stroke-width: 1.4; }
    .bad   { fill: #f7e8e8; stroke: #9a3030; stroke-width: 1.4; }
    .small { font-size: 11px; fill: #555; }
    .mono  { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; }
    .arrow { fill: none; stroke: #444; stroke-width: 1.4; }
    .badarrow { fill: none; stroke: #9a3030; stroke-width: 1.4; stroke-dasharray: 5 3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3030"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="600">RF register access</text>
  <text x="20" y="46" class="small">Reads and writes take entirely different routes to the same RF register. Getting it wrong returns no error.</text>

  <!-- WRITE column -->
  <rect class="write" x="40" y="76" width="330" height="52" rx="3"/>
  <text x="205" y="98" text-anchor="middle" font-weight="600">_WriteRF(path, reg, value)</text>
  <text x="205" y="116" text-anchor="middle" class="small">e.g. tune the synthesizer: reg 0x18</text>

  <path class="arrow" d="M 205 128 L 205 164" marker-end="url(#arr)"/>

  <rect class="box" x="40" y="164" width="330" height="66" rx="3"/>
  <text x="205" y="184" text-anchor="middle" font-weight="600">build a 28-bit command</text>
  <text x="205" y="205" text-anchor="middle" class="mono">(reg &lt;&lt; 20) | (value &amp; 0xFFFFF)</text>
  <text x="205" y="221" text-anchor="middle" class="small">address in bits 27:20, data in bits 19:0</text>

  <path class="arrow" d="M 205 230 L 205 266" marker-end="url(#arr)"/>

  <rect class="write" x="40" y="266" width="330" height="96" rx="3"/>
  <text x="205" y="286" text-anchor="middle" font-weight="600">3-wire LSSI write register</text>
  <text x="205" y="308" text-anchor="middle" class="mono">A 0x0C90    B 0x0E90</text>
  <text x="205" y="326" text-anchor="middle" class="mono">C 0x1890    D 0x1A90</text>
  <text x="205" y="348" text-anchor="middle" class="small">kRfLssiWriteReg[path] — one per RF path</text>

  <!-- READ column -->
  <rect class="read" x="530" y="76" width="330" height="52" rx="3"/>
  <text x="695" y="98" text-anchor="middle" font-weight="600">_ReadRF(path, reg)</text>
  <text x="695" y="116" text-anchor="middle" class="small">no command to write, nothing to wait for</text>

  <path class="arrow" d="M 695 128 L 695 164" marker-end="url(#arr)"/>

  <rect class="box" x="530" y="164" width="330" height="66" rx="3"/>
  <text x="695" y="184" text-anchor="middle" font-weight="600">index the direct-mapped window</text>
  <text x="695" y="205" text-anchor="middle" class="mono">base + reg * 4</text>
  <text x="695" y="221" text-anchor="middle" class="small">each RF register owns a 32-bit slot</text>

  <path class="arrow" d="M 695 230 L 695 266" marker-end="url(#arr)"/>

  <rect class="read" x="530" y="266" width="330" height="96" rx="3"/>
  <text x="695" y="286" text-anchor="middle" font-weight="600">read window base</text>
  <text x="695" y="308" text-anchor="middle" class="mono">A 0x2800    B 0x2C00</text>
  <text x="695" y="326" text-anchor="middle" class="mono">C 0x3800    D 0x3C00</text>
  <text x="695" y="348" text-anchor="middle" class="small">kBBRegPathBase[path] — read only</text>

  <!-- the chip -->
  <rect class="chip" x="285" y="410" width="330" height="52" rx="3"/>
  <text x="450" y="431" text-anchor="middle" font-weight="600">RF transceiver register</text>
  <text x="450" y="449" text-anchor="middle" class="small">four paths, 20-bit registers</text>

  <path class="arrow" d="M 205 362 L 205 386 L 340 386 L 340 410" marker-end="url(#arr)"/>
  <path class="arrow" d="M 695 362 L 695 386 L 560 386 L 560 410" marker-end="url(#arr)"/>

  <!-- the historical bug -->
  <rect class="bad" x="40" y="482" width="820" height="58" rx="3"/>
  <text x="56" y="502" font-weight="600" fill="#9a3030">The bug this replaced</text>
  <text x="56" y="521" class="small">Writes went to kBBRegPathBase[path] + 0x1C — 0x281C for path A — which is inside the read window and is not a write</text>
  <text x="56" y="535" class="small">interface. Every RF write was silently discarded, so the chip never changed channel and stayed on channel 1.</text>

  <path class="badarrow" d="M 128 362 L 128 482" marker-end="url(#arrbad)"/>
</svg>
