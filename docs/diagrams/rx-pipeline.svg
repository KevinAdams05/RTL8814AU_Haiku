<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
  <style>
    .box   { fill: #f6f8fa; stroke: #444; stroke-width: 1.2; }
    .chip  { fill: #e7eef7; stroke: #2c5aa0; stroke-width: 1.4; }
    .rxpath { fill: #fffdf2; stroke: #b08020; stroke-width: 1.4; }
    .dispatch { fill: #f0e7f5; stroke: #6f3997; stroke-width: 1.4; }
    .leaf  { fill: #e7f5ea; stroke: #2c8a4a; stroke-width: 1.4; }
    .drop  { fill: #f7e8e8; stroke: #9a3030; stroke-width: 1.4; }
    .lbl   { fill: #111; }
    .small { font-size: 11px; fill: #555; }
    .arrow { fill: none; stroke: #444; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="600">RX pipeline</text>
  <text x="20" y="46" class="small">From the chip's USB bulk-IN URBs into the Haiku network stack (or the in-driver WPA2 handshake inbox).</text>

  <!-- chip -->
  <rect class="chip" x="340" y="68" width="220" height="46" rx="3"/>
  <text x="450" y="92" text-anchor="middle" font-weight="600">chip → USB bulk-IN URB</text>
  <text x="450" y="108" text-anchor="middle" class="small">one URB carries multiple 802.11 frames</text>

  <!-- RxPath::_RxCallback -->
  <rect class="rxpath" x="340" y="138" width="220" height="44" rx="3"/>
  <text x="450" y="160" text-anchor="middle" font-weight="600">RxPath::_RxCallback</text>
  <text x="450" y="175" text-anchor="middle" class="small">USB completion handler</text>

  <!-- _ProcessTransfer -->
  <rect class="rxpath" x="320" y="206" width="260" height="56" rx="3"/>
  <text x="450" y="228" text-anchor="middle" font-weight="600">RxPath::_ProcessTransfer</text>
  <text x="450" y="244" text-anchor="middle" class="small">walk RX descriptors • strip FCS</text>
  <text x="450" y="258" text-anchor="middle" class="small">parse SWDEC bit • handle PHY status</text>

  <!-- _RxFrameReceived -->
  <rect class="rxpath" x="320" y="284" width="260" height="58" rx="3"/>
  <text x="450" y="306" text-anchor="middle" font-weight="600">Device::_RxFrameReceived</text>
  <text x="450" y="322" text-anchor="middle" class="small">if Protected=1: SW CCMP decrypt in place</text>
  <text x="450" y="338" text-anchor="middle" class="small">classify by FC type (mgmt/control/data)</text>

  <!-- branch labels -->
  <text x="160" y="378" text-anchor="middle" class="small" font-style="italic">type = 0 (mgmt)</text>
  <text x="450" y="378" text-anchor="middle" class="small" font-style="italic">type = 1 (control)</text>
  <text x="740" y="378" text-anchor="middle" class="small" font-style="italic">type = 2 (data)</text>

  <!-- mgmt destination -->
  <rect class="dispatch" x="40" y="392" width="240" height="62" rx="3"/>
  <text x="160" y="414" text-anchor="middle" font-weight="600">WiFiManager dispatch</text>
  <text x="160" y="430" text-anchor="middle" class="small">_ParseBeaconOrProbe</text>
  <text x="160" y="446" text-anchor="middle" class="small">_HandleAuth / _HandleAssoc</text>

  <!-- control dropped -->
  <rect class="drop" x="370" y="392" width="160" height="62" rx="3"/>
  <text x="450" y="416" text-anchor="middle" font-weight="600">discarded</text>
  <text x="450" y="434" text-anchor="middle" class="small">chip handles ACK/RTS/CTS</text>
  <text x="450" y="448" text-anchor="middle" class="small">in hardware</text>

  <!-- data sub-branch -->
  <rect class="rxpath" x="620" y="392" width="240" height="62" rx="3"/>
  <text x="740" y="414" text-anchor="middle" font-weight="600">LLC/SNAP check</text>
  <text x="740" y="432" text-anchor="middle" class="small">verify AA AA 03 at offset 24</text>
  <text x="740" y="448" text-anchor="middle" class="small">extract ethertype @ 30..31</text>

  <!-- ethertype labels -->
  <text x="640" y="488" text-anchor="middle" class="small" font-style="italic">ethertype = 0x888E (EAPOL)</text>
  <text x="840" y="488" text-anchor="middle" class="small" font-style="italic">other (IP / ARP / …)</text>

  <!-- EAPOL inbox -->
  <rect class="leaf" x="540" y="502" width="200" height="62" rx="3"/>
  <text x="640" y="524" text-anchor="middle" font-weight="600">fEapolInbox</text>
  <text x="640" y="542" text-anchor="middle" class="small">in-driver WPA2</text>
  <text x="640" y="556" text-anchor="middle" class="small">4-way handshake worker</text>

  <!-- ring / Read -->
  <rect class="leaf" x="760" y="502" width="120" height="62" rx="3"/>
  <text x="820" y="524" text-anchor="middle" font-weight="600">fRxRing</text>
  <text x="820" y="542" text-anchor="middle" class="small">→ Read()</text>
  <text x="820" y="558" text-anchor="middle" class="small">→ Haiku stack</text>

  <!-- arrows -->
  <path class="arrow" d="M 450 114 L 450 138" marker-end="url(#arr)"/>
  <path class="arrow" d="M 450 182 L 450 206" marker-end="url(#arr)"/>
  <path class="arrow" d="M 450 262 L 450 284" marker-end="url(#arr)"/>

  <!-- fan-out from _RxFrameReceived -->
  <path class="arrow" d="M 380 342 L 380 384 L 160 384 L 160 392" marker-end="url(#arr)"/>
  <path class="arrow" d="M 450 342 L 450 392" marker-end="url(#arr)"/>
  <path class="arrow" d="M 520 342 L 520 384 L 740 384 L 740 392" marker-end="url(#arr)"/>

  <!-- LLC fan-out -->
  <path class="arrow" d="M 680 454 L 680 494 L 640 494 L 640 502" marker-end="url(#arr)"/>
  <path class="arrow" d="M 800 454 L 800 494 L 820 494 L 820 502" marker-end="url(#arr)"/>
</svg>
