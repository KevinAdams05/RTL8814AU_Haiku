<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
  <style>
    .user    { fill: #e7eef7; stroke: #2c5aa0; stroke-width: 1.4; }
    .device  { fill: #fffdf2; stroke: #b08020; stroke-width: 1.4; }
    .manager { fill: #f0e7f5; stroke: #6f3997; stroke-width: 1.4; }
    .leaf    { fill: #e7f5ea; stroke: #2c8a4a; stroke-width: 1.4; }
    .small   { font-size: 11px; fill: #555; }
    .note    { font-size: 11px; fill: #6a4080; font-style: italic; }
    .arrow   { fill: none; stroke: #444; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="600">Scan flow</text>
  <text x="20" y="46" class="small">From `ifconfig &lt;dev&gt; scan` to `B_NETWORK_WLAN_SCANNED` notification.</text>

  <!-- userland -->
  <rect class="user" x="320" y="74" width="260" height="44" rx="3"/>
  <text x="450" y="96" text-anchor="middle" font-weight="600">ifconfig &lt;dev&gt; scan</text>
  <text x="450" y="112" text-anchor="middle" class="small">SIOCS80211  IOC_SCAN_REQ</text>

  <!-- _DoScanRequest -->
  <rect class="device" x="320" y="142" width="260" height="44" rx="3"/>
  <text x="450" y="166" text-anchor="middle" font-weight="600">Device::_DoScanRequest</text>
  <text x="450" y="182" text-anchor="middle" class="small">checks state, delegates to manager</text>

  <!-- WiFiManager -->
  <rect class="manager" x="320" y="210" width="260" height="44" rx="3"/>
  <text x="450" y="234" text-anchor="middle" font-weight="600">WiFiManager::StartScan</text>
  <text x="450" y="250" text-anchor="middle" class="small">three parallel actions:</text>

  <!-- 3-way fan-out labels -->
  <text x="150" y="290" text-anchor="middle" class="note">1. purge stale</text>
  <text x="450" y="290" text-anchor="middle" class="note">2. send H2C</text>
  <text x="750" y="290" text-anchor="middle" class="note">3. spawn notifier</text>

  <!-- 3 children -->
  <rect class="leaf" x="40" y="304" width="220" height="74" rx="3"/>
  <text x="150" y="326" text-anchor="middle" font-weight="600">purge BSS list</text>
  <text x="150" y="346" text-anchor="middle" class="small">drop entries older than</text>
  <text x="150" y="360" text-anchor="middle" class="small">the previous scan</text>

  <rect class="leaf" x="320" y="304" width="260" height="74" rx="3"/>
  <text x="450" y="326" text-anchor="middle" font-weight="600">H2C IOC_SCAN_EN</text>
  <text x="450" y="346" text-anchor="middle" class="small">firmware starts active scan;</text>
  <text x="450" y="360" text-anchor="middle" class="small">beacons + probe-resps arrive</text>

  <rect class="leaf" x="640" y="304" width="220" height="74" rx="3"/>
  <text x="750" y="326" text-anchor="middle" font-weight="600">scan-notifier thread</text>
  <text x="750" y="346" text-anchor="middle" class="small">8-sec timeout, fires</text>
  <text x="750" y="360" text-anchor="middle" class="small">B_NETWORK_WLAN_SCANNED</text>

  <!-- result fetch -->
  <rect class="user" x="320" y="398" width="260" height="44" rx="3"/>
  <text x="450" y="420" text-anchor="middle" font-weight="600">userland fetches results</text>
  <text x="450" y="436" text-anchor="middle" class="small">SIOCG80211 IOC_SCAN_RESULTS</text>

  <!-- arrows -->
  <path class="arrow" d="M 450 118 L 450 142" marker-end="url(#arr)"/>
  <path class="arrow" d="M 450 186 L 450 210" marker-end="url(#arr)"/>

  <path class="arrow" d="M 380 254 L 380 296 L 150 296 L 150 304" marker-end="url(#arr)"/>
  <path class="arrow" d="M 450 254 L 450 304" marker-end="url(#arr)"/>
  <path class="arrow" d="M 520 254 L 520 296 L 750 296 L 750 304" marker-end="url(#arr)"/>

  <path class="arrow" d="M 750 378 L 750 410 L 580 410" marker-end="url(#arr)"/>
</svg>
