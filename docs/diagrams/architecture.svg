<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="Helvetica, Arial, sans-serif" font-size="13">
	<defs>
		<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
			<path d="M0,0 L0,6 L9,3 z" fill="#333"/>
		</marker>
		<style>
			.box{fill:#fff;stroke:#333;stroke-width:1.5;rx:5;ry:5}
			.title{font-weight:bold;font-size:14px}
			.section{font-weight:bold;font-size:12px;fill:#666}
			.muted{fill:#777;font-size:11px}
			.io{fill:#fff5e6;stroke:#cc7a00;stroke-width:1.5;rx:5;ry:5}
			.kern{fill:#e6f0ff;stroke:#1f5fc4;stroke-width:1.5;rx:5;ry:5}
			.user{fill:#eaf6ea;stroke:#2f7a2f;stroke-width:1.5;rx:5;ry:5}
			.thread{fill:#fff0f5;stroke:#a3437a;stroke-width:1.5;rx:5;ry:5}
			.flow{stroke:#333;stroke-width:1.5;fill:none}
		</style>
	</defs>

	<text x="440" y="22" text-anchor="middle" class="title">rtl8814au driver — block diagram</text>

	<!-- Top: hardware -->
	<text x="60" y="55" class="section">USB / chip</text>
	<rect x="60" y="65" width="170" height="60" class="io"/>
	<text x="145" y="88" text-anchor="middle">RTL8814AU chip</text>
	<text x="145" y="106" text-anchor="middle" class="muted">USB 3.0 — 4 endpoints</text>
	<text x="145" y="120" text-anchor="middle" class="muted">3 × bulk OUT, 1 bulk IN, 1 int IN</text>

	<!-- USB stack arrow -->
	<line x1="145" y1="125" x2="145" y2="170" class="flow" marker-end="url(#arrow)"/>

	<!-- Driver block -->
	<rect x="40" y="170" width="800" height="370" fill="#fafafa" stroke="#aaa" stroke-dasharray="4 3" rx="6" ry="6"/>
	<text x="60" y="190" class="section">Kernel driver (rtl8814au.so)</text>

	<!-- TxPath / RxPath / Firmware / EFUSE row -->
	<rect x="60" y="200" width="170" height="60" class="kern"/>
	<text x="145" y="222" text-anchor="middle" class="title">RxPath</text>
	<text x="145" y="240" text-anchor="middle" class="muted">bulk-IN URBs, descriptor</text>
	<text x="145" y="254" text-anchor="middle" class="muted">parse → _RxFrameReceived</text>

	<rect x="240" y="200" width="170" height="60" class="kern"/>
	<text x="325" y="222" text-anchor="middle" class="title">TxPath</text>
	<text x="325" y="240" text-anchor="middle" class="muted">descriptor build,</text>
	<text x="325" y="254" text-anchor="middle" class="muted">bulk-OUT submit</text>

	<rect x="420" y="200" width="170" height="60" class="kern"/>
	<text x="505" y="222" text-anchor="middle" class="title">Firmware loader</text>
	<text x="505" y="240" text-anchor="middle" class="muted">IDDMA push DMEM/IRAM,</text>
	<text x="505" y="254" text-anchor="middle" class="muted">8-byte XOR trailers</text>

	<rect x="600" y="200" width="170" height="60" class="kern"/>
	<text x="685" y="222" text-anchor="middle" class="title">PhyConfig</text>
	<text x="685" y="240" text-anchor="middle" class="muted">BB/AGC/RF tables, channel,</text>
	<text x="685" y="254" text-anchor="middle" class="muted">IQ calibration, TX power</text>

	<!-- Middle row -->
	<rect x="60" y="280" width="170" height="60" class="kern"/>
	<text x="145" y="302" text-anchor="middle" class="title">RegisterIO</text>
	<text x="145" y="320" text-anchor="middle" class="muted">USB control transfers</text>
	<text x="145" y="334" text-anchor="middle" class="muted">read/write 8/16/32 regs</text>

	<rect x="240" y="280" width="170" height="60" class="kern"/>
	<text x="325" y="302" text-anchor="middle" class="title">EfuseReader</text>
	<text x="325" y="320" text-anchor="middle" class="muted">MAC, antenna, RFE,</text>
	<text x="325" y="334" text-anchor="middle" class="muted">thermal cal at boot</text>

	<rect x="420" y="280" width="170" height="60" class="kern"/>
	<text x="505" y="302" text-anchor="middle" class="title">WiFiManagement</text>
	<text x="505" y="320" text-anchor="middle" class="muted">scan, BSS list, H2C/C2H</text>
	<text x="505" y="334" text-anchor="middle" class="muted">interrupt-IN listener</text>

	<rect x="600" y="280" width="170" height="60" class="kern"/>
	<text x="685" y="302" text-anchor="middle" class="title">WPA2Crypto</text>
	<text x="685" y="320" text-anchor="middle" class="muted">SHA-1, HMAC-SHA1, AES-128,</text>
	<text x="685" y="334" text-anchor="middle" class="muted">PRF-384, PBKDF2, RFC 3394</text>

	<!-- Device class -->
	<rect x="60" y="360" width="710" height="80" class="kern"/>
	<text x="415" y="382" text-anchor="middle" class="title">Device (Device.cpp / Device.h)</text>
	<text x="415" y="402" text-anchor="middle" class="muted">RX ring + EAPOL inbox + scan-notifier + post-assoc worker + EAPOL 4-way worker</text>
	<text x="415" y="418" text-anchor="middle" class="muted">SIOCS80211/SIOCG80211 IOC dispatch · _DoJoin auth+assoc state machine</text>
	<text x="415" y="432" text-anchor="middle" class="muted">EAPOL state machine drives WPA2-PSK 4-way handshake in-kernel</text>

	<!-- Threads on the right -->
	<rect x="600" y="450" width="170" height="80" class="thread"/>
	<text x="685" y="472" text-anchor="middle" class="title">Kernel threads</text>
	<text x="685" y="490" text-anchor="middle" class="muted">scan-notifier · post-assoc</text>
	<text x="685" y="506" text-anchor="middle" class="muted">eapol_4way</text>
	<text x="685" y="520" text-anchor="middle" class="muted">+ USB callbacks (RX/TX/intIN)</text>

	<!-- Driver entry -->
	<rect x="60" y="450" width="320" height="80" class="kern"/>
	<text x="220" y="472" text-anchor="middle" class="title">Driver.cpp</text>
	<text x="220" y="490" text-anchor="middle" class="muted">init_driver, publish_devices,</text>
	<text x="220" y="506" text-anchor="middle" class="muted">find_device, USB device-add hook</text>
	<text x="220" y="520" text-anchor="middle" class="muted">claims chip → creates Device instance</text>

	<rect x="400" y="450" width="180" height="80" class="kern"/>
	<text x="490" y="472" text-anchor="middle" class="title">WiFiIoctl.h</text>
	<text x="490" y="490" text-anchor="middle" class="muted">struct ieee80211req,</text>
	<text x="490" y="506" text-anchor="middle" class="muted">IOC opcodes, MLME struct,</text>
	<text x="490" y="520" text-anchor="middle" class="muted">rtl_haiku_join_psk</text>

	<!-- Kernel network stack -->
	<text x="60" y="565" class="section">Haiku network stack</text>
	<rect x="60" y="575" width="380" height="50" class="kern"/>
	<text x="250" y="595" text-anchor="middle">device_reader_thread → ethernet_deframe → consumer_thread</text>
	<text x="250" y="613" text-anchor="middle" class="muted">delivers IPv4/IPv6/ARP only — drops 0x888E (the bug we work around)</text>

	<!-- Userland -->
	<rect x="460" y="575" width="170" height="50" class="user"/>
	<text x="545" y="600" text-anchor="middle" class="title">ifconfig / DHCP</text>
	<text x="545" y="617" text-anchor="middle" class="muted">join, scan, IP config</text>

	<rect x="650" y="575" width="170" height="50" class="user"/>
	<text x="735" y="600" text-anchor="middle" class="title">wpa2_join (ours)</text>
	<text x="735" y="617" text-anchor="middle" class="muted">drives IOC_HAIKU_JOIN</text>

	<!-- Connecting flows -->
	<line x1="145" y1="260" x2="145" y2="280" class="flow" marker-end="url(#arrow)"/>
	<line x1="325" y1="260" x2="325" y2="280" class="flow" marker-end="url(#arrow)"/>
	<line x1="505" y1="260" x2="505" y2="280" class="flow" marker-end="url(#arrow)"/>
	<line x1="685" y1="260" x2="685" y2="280" class="flow" marker-end="url(#arrow)"/>
	<line x1="145" y1="340" x2="145" y2="360" class="flow" marker-end="url(#arrow)"/>
	<line x1="325" y1="340" x2="325" y2="360" class="flow" marker-end="url(#arrow)"/>
	<line x1="505" y1="340" x2="505" y2="360" class="flow" marker-end="url(#arrow)"/>
	<line x1="685" y1="340" x2="685" y2="360" class="flow" marker-end="url(#arrow)"/>

	<line x1="250" y1="540" x2="250" y2="575" class="flow" marker-end="url(#arrow)"/>
	<line x1="545" y1="540" x2="545" y2="575" class="flow" marker-end="url(#arrow)"/>
	<line x1="735" y1="540" x2="735" y2="575" class="flow" marker-end="url(#arrow)"/>
</svg>
